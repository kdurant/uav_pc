[basic]
local_ip = "192.168.2.111"
local_port = 12345
remote_port = 6666
# true: 通过 UDP 广播搜索设备；false: 直接使用 device_ip 通信
broadcast_search = false
# broadcast_search = false 时使用的设备 IP
device_ip = "192.168.1.10"

[capture]
preview_coe = 1000
ref_channal = 1
save_channal = 255
wave_len = 6000
first_pos = 100
first_len = 200
second_pos = 400
second_len = 400
sum_value = 0
max_value = 0
pin_threshold = 1000

[gps]
# GPS 数据文件所在目录（设备端路径），可用 0x0110 的 ls 查询
dir = "/run/media/mmcblk1p1/"
