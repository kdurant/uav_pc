[package]
name = "uav-pc"
version = "0.1.0"
description = "无人机采集卡上位机"
authors = [""]
edition = "2021"

[lib]
name = "uav_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt-multi-thread"] }
bytes = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
